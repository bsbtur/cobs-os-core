name: V3.9 interpretive coverage actions

on:
  push:
    branches:
      - preview/alpha-productization-px01
    paths:
      - .github/workflows/v39-coverage-actions.yml
      - scripts/v39-add-coverage-actions.py

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/alpha-productization-px01
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Apply V3.9 coverage actions
        run: python scripts/v39-add-coverage-actions.py
      - name: Format
        run: bunx prettier --write 'src/routes/_authenticated/blueprints.$blueprintId.tsx' 'src/routes/_authenticated/blueprints.$blueprintId.visit-points.tsx'
      - name: Tests
        run: bun test
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Commit V3.9
        run: |
          if git diff --quiet; then
            echo "No V3.9 changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'src/routes/_authenticated/blueprints.$blueprintId.tsx' 'src/routes/_authenticated/blueprints.$blueprintId.visit-points.tsx'
          git commit -m 'feat(blueprints): link coverage gaps to interpretive library'
          git push
