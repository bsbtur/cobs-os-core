name: PX final typecheck residual fix
on:
  push:
    branches: [preview/alpha-productization-px01]
    paths: [.github/workflows/px-final-typecheck-residual-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/alpha-productization-px01
          fetch-depth: 0
      - name: Patch exact optional RPC payload
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/journey/journey-management-panel.tsx')
          s=p.read_text()
          old='''        _traveler_facing: travelerFacing,\n        _planned_start: startIso ?? undefined,\n        _planned_end: endIso ?? undefined,\n        _presence_requirement: requirement,'''
          new='''        _traveler_facing: travelerFacing,\n        ...(startIso ? { _planned_start: startIso } : {}),\n        ...(endIso ? { _planned_end: endIso } : {}),\n        _presence_requirement: requirement,'''
          if s.count(old)!=1: raise SystemExit(f'unexpected match count: {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
      - name: Commit fix
        run: |
          rm -f .github/workflows/px-final-typecheck-residual-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(alpha): omit absent planned window RPC args"
          git push origin HEAD:preview/alpha-productization-px01
