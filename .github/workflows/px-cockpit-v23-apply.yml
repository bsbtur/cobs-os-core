name: PX cockpit V2.3 apply

on:
  push:
    branches:
      - preview/alpha-productization-px01
    paths:
      - .github/workflows/px-cockpit-v23-apply.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/alpha-productization-px01
      - uses: oven-sh/setup-bun@v2
      - name: Apply deterministic refactor
        run: python3 scripts/px-cockpit-v23-apply.py
      - name: Format
        run: bunx prettier --write 'src/routes/_authenticated/operations.$operationId.live.tsx' 'src/routes/_authenticated/operations.$operationId.cockpit-v2.tsx' 'src/components/journey/journey-step-actions.tsx'
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Lint
        run: bun run lint
      - name: Commit
        run: |
          git config user.name "bsbtur"
          git config user.email "contato.bsbtur@gmail.com"
          git add 'src/routes/_authenticated/operations.$operationId.live.tsx' 'src/routes/_authenticated/operations.$operationId.cockpit-v2.tsx' src/components/journey/journey-step-actions.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "refactor(cockpit-v2): reuse canonical journey step actions"
          git push origin HEAD:preview/alpha-productization-px01
