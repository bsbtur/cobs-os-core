name: PX final prettier apply
on:
  push:
    branches: [preview/alpha-productization-px01]
    paths: [.github/workflows/px-final-prettier-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/alpha-productization-px01
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Apply repository formatter
        run: bunx prettier --write . --ignore-unknown
      - name: Commit formatter output
        run: |
          rm -f .github/workflows/px-final-prettier-apply.yml .github/workflows/px-final-typecheck-residual-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style(alpha): align repository with prettier"
          git push origin HEAD:preview/alpha-productization-px01

# one-shot trigger
