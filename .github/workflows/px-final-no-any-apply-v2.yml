name: PX final no-any apply v2
on:
  push:
    branches: [preview/alpha-productization-px01]
    paths: [.github/workflows/px-final-no-any-apply-v2.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/alpha-productization-px01
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Sync scoped generated types and remove explicit any
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              n = text.count(old)
              print(label, n)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1, got {n}")
              p.write_text(text.replace(old, new, 1))

          types = Path('src/integrations/supabase/types.ts')
          text = types.read_text()

          if '      operation_staff_assignments: {' not in text:
              block = '''      operation_staff_assignments: {\n        Row: {\n          cancelled_at: string | null;\n          completed_at: string | null;\n          confirmed_at: string | null;\n          created_at: string;\n          created_by: string | null;\n          declined_at: string | null;\n          ends_at: string;\n          id: string;\n          notes: string | null;\n          operation_id: string;\n          participation_id: string;\n          report_at: string | null;\n          role_type_id: string;\n          starts_at: string;\n          status: Database["public"]["Enums"]["staff_assignment_status"];\n          tenant_id: string;\n          updated_at: string;\n          updated_by: string | null;\n        };\n        Insert: {\n          cancelled_at?: string | null;\n          completed_at?: string | null;\n          confirmed_at?: string | null;\n          created_at?: string;\n          created_by?: string | null;\n          declined_at?: string | null;\n          ends_at: string;\n          id?: string;\n          notes?: string | null;\n          operation_id: string;\n          participation_id: string;\n          report_at?: string | null;\n          role_type_id: string;\n          starts_at: string;\n          status?: Database["public"]["Enums"]["staff_assignment_status"];\n          tenant_id: string;\n          updated_at?: string;\n          updated_by?: string | null;\n        };\n        Update: {\n          cancelled_at?: string | null;\n          completed_at?: string | null;\n          confirmed_at?: string | null;\n          created_at?: string;\n          created_by?: string | null;\n          declined_at?: string | null;\n          ends_at?: string;\n          id?: string;\n          notes?: string | null;\n          operation_id?: string;\n          participation_id?: string;\n          report_at?: string | null;\n          role_type_id?: string;\n          starts_at?: string;\n          status?: Database["public"]["Enums"]["staff_assignment_status"];\n          tenant_id?: string;\n          updated_at?: string;\n          updated_by?: string | null;\n        };\n        Relationships: [\n          { foreignKeyName: "operation_staff_assignments_created_by_fkey"; columns: ["created_by"]; isOneToOne: false; referencedRelation: "profiles"; referencedColumns: ["id"] },\n          { foreignKeyName: "operation_staff_assignments_operation_fk"; columns: ["operation_id", "tenant_id"]; isOneToOne: false; referencedRelation: "operations"; referencedColumns: ["id", "tenant_id"] },\n          { foreignKeyName: "operation_staff_assignments_participation_fk"; columns: ["participation_id", "tenant_id"]; isOneToOne: false; referencedRelation: "operation_participations"; referencedColumns: ["id", "tenant_id"] },\n          { foreignKeyName: "operation_staff_assignments_role_type_fk"; columns: ["role_type_id", "tenant_id"]; isOneToOne: false; referencedRelation: "operation_role_types"; referencedColumns: ["id", "tenant_id"] },\n          { foreignKeyName: "operation_staff_assignments_tenant_id_fkey"; columns: ["tenant_id"]; isOneToOne: false; referencedRelation: "tenants"; referencedColumns: ["id"] },\n          { foreignKeyName: "operation_staff_assignments_updated_by_fkey"; columns: ["updated_by"]; isOneToOne: false; referencedRelation: "profiles"; referencedColumns: ["id"] },\n        ];\n      };\n'''
              anchor = '      operations: {'
              if text.count(anchor) != 1:
                  raise SystemExit('operations anchor mismatch')
              text = text.replace(anchor, block + anchor, 1)

          function_snippets = [
              ('      generate_due_staff_journey_alerts: {', '      generate_due_staff_journey_alerts: { Args: { _tenant_id: string; _window_end?: string; _window_start?: string }; Returns: Json };\n'),
              ('      get_my_message_inbox: {', '      get_my_message_inbox: { Args: { _limit?: number; _tenant_id: string }; Returns: Json };\n'),
              ('      get_operation_staff_assignment_conflicts: {', '      get_operation_staff_assignment_conflicts: { Args: { _from: string; _tenant_id: string; _to: string }; Returns: { assignment_id: string; conflicting_assignment_id: string; overlap_end: string; overlap_start: string; participation_id: string }[] };\n'),
              ('      mark_message_read: {', '      mark_message_read: { Args: { _message_id: string }; Returns: Json };\n'),
              ('      save_operation_staff_assignment: {', '      save_operation_staff_assignment: { Args: { _assignment_id?: string; _ends_at: string; _notes?: string; _operation_id: string; _participation_id: string; _report_at?: string; _role_type_id: string; _starts_at: string; _tenant_id: string }; Returns: string };\n'),
              ('      set_operation_staff_assignment_status: {', '      set_operation_staff_assignment_status: { Args: { _assignment_id: string; _note?: string; _status: Database["public"]["Enums"]["staff_assignment_status"] }; Returns: undefined };\n'),
          ]
          fn_anchor = '      get_commerce_catalog: {'
          for key, snippet in function_snippets:
              if key not in text:
                  if text.count(fn_anchor) != 1:
                      raise SystemExit('function anchor mismatch')
                  text = text.replace(fn_anchor, snippet + fn_anchor, 1)

          enum_anchor = '      step_plan_origin: "planned" | "ad_hoc";'
          if '      staff_assignment_status:' not in text:
              if text.count(enum_anchor) != 1:
                  raise SystemExit(f'enum union anchor mismatch: {text.count(enum_anchor)}')
              text = text.replace(enum_anchor, '      staff_assignment_status: "assigned" | "confirmed" | "declined" | "cancelled" | "completed";\n' + enum_anchor, 1)
          types.write_text(text)

          replace_once('src/components/operations/personal-alerts.tsx', '  const db = supabase as any;\n', '', 'alerts db any')
          p = Path('src/components/operations/personal-alerts.tsx')
          p.write_text(p.read_text().replace('await db.rpc(', 'await supabase.rpc('))

          replace_once('src/components/operations/personal-operation-queue.tsx', '  const db = supabase as any;\n', '', 'queue db any')
          p = Path('src/components/operations/personal-operation-queue.tsx')
          q = p.read_text().replace('        db\n          .from("operation_staff_assignments")', '        supabase\n          .from("operation_staff_assignments")').replace('await db.rpc(', 'await supabase.rpc(')
          old = '      const staffByParticipation = new Map<string, any[]>();\n      for (const row of staffAssignments.data ?? []) {'
          new = '      type StaffAssignmentRow = NonNullable<typeof staffAssignments.data>[number];\n      const staffByParticipation = new Map<string, StaffAssignmentRow[]>();\n      for (const row of staffAssignments.data ?? []) {'
          if q.count(old) != 1:
              raise SystemExit('queue map any mismatch')
          q = q.replace(old, new, 1)
          q = q.replace('typeof useMutation<any, Error, { assignmentId: string; status: "confirmed" | "declined" }>', 'typeof useMutation<void, Error, { assignmentId: string; status: "confirmed" | "declined" }>', 1)
          p.write_text(q)

          replace_once('src/routes/_authenticated/operations.$operationId.schedule.tsx', '  const db = supabase as any;\n', '', 'schedule db any')
          p = Path('src/routes/_authenticated/operations.$operationId.schedule.tsx')
          q = p.read_text().replace('        db\n          .from(', '        supabase\n          .from(').replace('        db.rpc(', '        supabase.rpc(').replace('? db.from(', '? supabase.from(').replace('await db.rpc(', 'await supabase.rpc(')
          q = q.replace('(p: any) => one(p.people)?.id === me.data.id', '(p) => one(p.people)?.id === me.data.id')
          q = q.replace('onError: (err: any) =>', 'onError: (err: unknown) =>')
          q = q.replace('err?.message ??\n          copy(locale, "Não foi possível salvar a escala.", "Could not save schedule.")', 'err instanceof Error\n          ? err.message\n          : copy(locale, "Não foi possível salvar a escala.", "Could not save schedule.")')
          q = q.replace('err?.message ??\n          copy(locale, "Não foi possível alterar a escala.", "Could not update schedule.")', 'err instanceof Error\n          ? err.message\n          : copy(locale, "Não foi possível alterar a escala.", "Could not update schedule.")')
          q = q.replace('conflicts.flatMap((item: any) => [item.assignment_id, item.conflicting_assignment_id])', 'conflicts.flatMap((item) => [item.assignment_id, item.conflicting_assignment_id])')
          p.write_text(q)

          p = Path('src/routes/api.cron.staff-alerts.ts')
          q = p.read_text()
          start = q.find('  const generateDueAlerts = supabase.rpc as unknown as (')
          if start >= 0:
              end = q.find('\n\n', start)
              if end < 0:
                  raise SystemExit('staff alert cast end missing')
              q = q[:start] + q[end+2:]
          q = q.replace('await generateDueAlerts("generate_due_staff_journey_alerts", {', 'await supabase.rpc("generate_due_staff_journey_alerts", {')
          p.write_text(q)
          PY
          bunx prettier --write src/integrations/supabase/types.ts src/components/operations/personal-alerts.tsx src/components/operations/personal-operation-queue.tsx 'src/routes/_authenticated/operations.$operationId.schedule.tsx' src/routes/api.cron.staff-alerts.ts
          bunx tsc --noEmit
          bunx eslint .
          git diff --check
      - name: Commit scoped typing fix
        run: |
          rm -f .github/workflows/px-final-no-any-apply.yml .github/workflows/px-final-no-any-apply-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(alpha): sync staff schedule Supabase types"
          git push origin HEAD:preview/alpha-productization-px01
