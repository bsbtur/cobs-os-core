name: PILOT-03 hardening fix pack 01

on:
  push:
    branches: [preview/alpha-productization-px01]
    paths: [.github/workflows/pilot03-hardening-fix-pack-01.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/alpha-productization-px01
          fetch-depth: 0
      - name: Apply hardening patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              s = p.read_text()
              for old, new, label in replacements:
                  count = s.count(old)
                  print(f'{path}: {label}: matches={count}')
                  if count < 1:
                      raise SystemExit(f'{path}: missing pattern: {label}')
                  s = s.replace(old, new, 1)
              p.write_text(s)

          patch('src/lib/operation-lock.tsx', [
            (
              'export function isOperationClosed(status: string | null | undefined): boolean {\n  return status === "completed" || status === "cancelled";\n}\n',
              'export function isOperationClosed(status: string | null | undefined): boolean {\n  return status === "completed" || status === "cancelled";\n}\n\nexport function operationEmptyBody(\n  operationClosed: boolean,\n  locale: string,\n  historicalPt: string,\n  historicalEn: string,\n  editableBody: string,\n): string {\n  if (!operationClosed) return editableBody;\n  return locale.toLowerCase().startsWith("pt") ? historicalPt : historicalEn;\n}\n',
              'shared-empty-state-helper',
            ),
          ])

          patch('src/routes/_authenticated/operations.$operationId.schedule.tsx', [
            (
              '{own && assignment.status === "assigned" ? <><Button',
              '{!operationClosed && own && assignment.status === "assigned" ? <><Button',
              'hide-own-status-actions-closed',
            ),
            (
              '{canManage && ["assigned", "confirmed"].includes(assignment.status) ? <Button',
              '{!operationClosed && canManage && ["assigned", "confirmed"].includes(assignment.status) ? <Button',
              'hide-cancel-closed',
            ),
          ])

          patch('src/routes/_authenticated/operations.$operationId.mobility.tsx', [
            (
              'import { isOperationClosed, ReadOnlyNotice } from "@/lib/operation-lock";',
              'import { isOperationClosed, operationEmptyBody, ReadOnlyNotice } from "@/lib/operation-lock";',
              'import-empty-helper',
            ),
            (
              '<EmptyState icon={Bus} title={t("w05.empty")} body={t("w05.emptyBody")} />',
              '<EmptyState\n          icon={Bus}\n          title={t("w05.empty")}\n          body={operationEmptyBody(\n            operationClosed,\n            locale,\n            "Nenhum trecho de transporte foi registrado nesta operação.",\n            "No transport leg was recorded for this operation.",\n            t("w05.emptyBody"),\n          )}\n        />',
              'historical-empty-copy',
            ),
          ])

          patch('src/routes/_authenticated/operations.$operationId.hospitality.tsx', [
            (
              'import { isOperationClosed, ReadOnlyNotice } from "@/lib/operation-lock";',
              'import { isOperationClosed, operationEmptyBody, ReadOnlyNotice } from "@/lib/operation-lock";',
              'import-empty-helper',
            ),
            (
              '<EmptyState icon={BedDouble} title={t("w06.empty")} body={t("w06.emptyBody")} />',
              '<EmptyState\n          icon={BedDouble}\n          title={t("w06.empty")}\n          body={operationEmptyBody(\n            operationClosed,\n            locale,\n            "Nenhuma hospedagem foi registrada nesta operação.",\n            "No accommodation was recorded for this operation.",\n            t("w06.emptyBody"),\n          )}\n        />',
              'historical-empty-copy',
            ),
          ])

          patch('src/routes/_authenticated/operations.$operationId.events.tsx', [
            (
              'import { isOperationClosed, ReadOnlyNotice } from "@/lib/operation-lock";',
              'import { isOperationClosed, operationEmptyBody, ReadOnlyNotice } from "@/lib/operation-lock";',
              'import-empty-helper',
            ),
            (
              '<EmptyState icon={Clapperboard} title={t("w07.empty")} body={t("w07.emptyBody")} />',
              '<EmptyState\n          icon={Clapperboard}\n          title={t("w07.empty")}\n          body={operationEmptyBody(\n            operationClosed,\n            locale,\n            "Nenhum evento foi registrado nesta operação.",\n            "No event was recorded for this operation.",\n            t("w07.emptyBody"),\n          )}\n        />',
              'historical-empty-copy',
            ),
          ])

          patch('src/routes/_authenticated/operations.$operationId.communication.tsx', [
            (
              'import { isOperationClosed, ReadOnlyNotice } from "@/lib/operation-lock";',
              'import { isOperationClosed, operationEmptyBody, ReadOnlyNotice } from "@/lib/operation-lock";',
              'import-empty-helper',
            ),
            (
              '<EmptyState icon={MessagesSquare} title={t("w08.empty")} body={t("w08.emptyBody")} />',
              '<EmptyState\n          icon={MessagesSquare}\n          title={t("w08.empty")}\n          body={operationEmptyBody(\n            operationClosed,\n            locale,\n            "Nenhuma mensagem foi registrada nesta operação.",\n            "No message was recorded for this operation.",\n            t("w08.emptyBody"),\n          )}\n        />',
              'historical-empty-copy-list',
            ),
            (
              '<EmptyState icon={MessagesSquare} title={t("w08.empty")} body={t("w08.emptyBody")} />',
              '<EmptyState\n              icon={MessagesSquare}\n              title={t("w08.empty")}\n              body={operationEmptyBody(\n                operationClosed,\n                locale,\n                "Nenhuma mensagem foi registrada nesta operação.",\n                "No message was recorded for this operation.",\n                t("w08.emptyBody"),\n              )}\n            />',
              'historical-empty-copy-detail',
            ),
          ])

          patch('src/components/operations/operation-attention-center.tsx', [
            (
              'import { useI18n } from "@/lib/i18n";',
              'import { useI18n } from "@/lib/i18n";\nimport { isOperationClosed } from "@/lib/operation-lock";',
              'import-operation-lock',
            ),
            (
              '  const isLive = location.pathname.endsWith(`/operations/${operationId}/live`);\n\n  const query = useQuery({',
              '  const isLive = location.pathname.endsWith(`/operations/${operationId}/live`);\n\n  const operation = useQuery({\n    queryKey: ["operation-status", operationId],\n    enabled: isLive,\n    staleTime: 10_000,\n    queryFn: async () => {\n      const { data, error } = await supabase\n        .from("operations")\n        .select("status")\n        .eq("id", operationId)\n        .maybeSingle();\n      if (error) throw error;\n      return data;\n    },\n  });\n  const operationClosed = isOperationClosed(operation.data?.status);\n\n  const query = useQuery({',
              'operation-status-query',
            ),
            (
              '    enabled: isLive,\n    refetchInterval: 20_000,',
              '    enabled: isLive && operation.isSuccess && !operationClosed,\n    refetchInterval: operationClosed ? false : 20_000,',
              'disable-polling-closed',
            ),
            (
              '  if (!isLive) return null;\n\n  if (query.isLoading) {',
              '  if (!isLive || operationClosed) return null;\n  if (operation.isLoading) return null;\n\n  if (query.isLoading) {',
              'hide-attention-closed',
            ),
          ])

          test_path = Path('src/lib/post-completion-hardening.test.ts')
          test_path.write_text('''import { describe, expect, test } from "bun:test";\nimport { readFileSync } from "node:fs";\nimport { isOperationClosed, operationEmptyBody } from "./operation-lock";\n\nconst read = (path: string) => readFileSync(path, "utf8");\n\ndescribe("PILOT-03 post-completion hardening", () => {\n  test("closed lifecycle helper", () => {\n    expect(isOperationClosed("completed")).toBe(true);\n    expect(isOperationClosed("cancelled")).toBe(true);\n    expect(isOperationClosed("active")).toBe(false);\n  });\n\n  test("historical empty state copy replaces actionable copy only when closed", () => {\n    expect(operationEmptyBody(true, "pt-BR", "Histórico", "Historical", "Criar agora")).toBe("Histórico");\n    expect(operationEmptyBody(true, "en-US", "Histórico", "Historical", "Create now")).toBe("Historical");\n    expect(operationEmptyBody(false, "pt-BR", "Histórico", "Historical", "Criar agora")).toBe("Criar agora");\n  });\n\n  test("schedule mutation controls are lifecycle gated", () => {\n    const source = read("src/routes/_authenticated/operations.$operationId.schedule.tsx");\n    expect(source).toContain("!operationClosed && own && assignment.status");\n    expect(source).toContain("!operationClosed && canManage &&");\n  });\n\n  test("closed schedule update is protected server-side", () => {\n    const migration = read("supabase/migrations/20260815211500_px12_7_closed_operation_read_only_guards.sql");\n    expect(migration).toContain("trg_closed_op_staff_assignments");\n    expect(migration).toContain("before insert or update or delete on public.operation_staff_assignments");\n    expect(migration).toContain("assert_operation_not_closed");\n  });\n\n  test("completed live attention polling is lifecycle gated", () => {\n    const source = read("src/components/operations/operation-attention-center.tsx");\n    expect(source).toContain("operation.isSuccess && !operationClosed");\n    expect(source).toContain("if (!isLive || operationClosed) return null");\n  });\n\n  test("all historical empty states use lifecycle helper", () => {\n    for (const path of [\n      "src/routes/_authenticated/operations.$operationId.mobility.tsx",\n      "src/routes/_authenticated/operations.$operationId.hospitality.tsx",\n      "src/routes/_authenticated/operations.$operationId.events.tsx",\n      "src/routes/_authenticated/operations.$operationId.communication.tsx",\n    ]) expect(read(path)).toContain("operationEmptyBody(");\n  });\n});\n''')
          PY
          git diff --check
          npm ci
          npm test -- src/lib/post-completion-hardening.test.ts
          npx tsc --noEmit
          npm run build
      - name: Commit verified fix pack
        run: |
          rm .github/workflows/pilot03-hardening-fix-pack-01.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(alpha): harden completed operation historical UX"
          git push origin HEAD:preview/alpha-productization-px01