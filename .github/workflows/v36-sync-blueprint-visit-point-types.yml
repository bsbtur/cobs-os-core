name: Sync blueprint visit point types

on:
  push:
    branches:
      - preview/alpha-productization-px01
    paths:
      - .github/workflows/v36-sync-blueprint-visit-point-types.yml
      - scripts/v36-sync-blueprint-visit-point-types.py

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/alpha-productization-px01
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Apply type sync
        run: python scripts/v36-sync-blueprint-visit-point-types.py
      - name: Format
        run: bunx prettier --write src/integrations/supabase/types.ts 'src/routes/_authenticated/blueprints.$blueprintId.visit-points.tsx'
      - name: Tests
        run: bun test
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Commit sync
        run: |
          if git diff --quiet; then
            echo "No type synchronization changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/integrations/supabase/types.ts 'src/routes/_authenticated/blueprints.$blueprintId.visit-points.tsx'
          git commit -m 'chore(supabase): sync blueprint visit point types'
          git push
