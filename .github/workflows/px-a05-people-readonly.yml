name: PX-A05 people readonly UX

on:
  push:
    branches: [preview/alpha-productization-px01]
    paths: [.github/workflows/px-a05-people-readonly.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/alpha-productization-px01
          fetch-depth: 0
      - name: Apply People read-only UX
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def rep(s, old, new, label, count=1):
              n=s.count(old)
              print(label, 'matches=', n)
              if n < count: raise SystemExit(f'{label}: missing expected pattern')
              return s.replace(old,new,count)

          helper=Path('src/lib/operation-lock.tsx')
          if not helper.exists():
              helper.write_text('''import { Lock } from "lucide-react";\nimport { useI18n } from "@/lib/i18n";\n\nexport function isOperationClosed(status: string | null | undefined): boolean {\n  return status === "completed" || status === "cancelled";\n}\n\nexport function ReadOnlyNotice({ className = "" }: { className?: string }) {\n  const { t } = useI18n();\n  return (\n    <div className={`flex items-start gap-2 rounded-lg border border-border bg-background/60 px-3 py-2 text-xs text-muted-foreground ${className}`} role="note">\n      <Lock className="mt-0.5 size-3.5 shrink-0" aria-hidden="true" />\n      <span><strong className="font-medium text-foreground">{t("op.readOnly")}</strong>{" "}{t("op.readOnlyBody")}</span>\n    </div>\n  );\n}\n''')

          ip=Path('src/lib/i18n-w02.ts'); x=ip.read_text()
          if '"op.readOnly"' not in x:
              x=rep(x,'  "op.statusChanged": "Status atualizado.",','  "op.statusChanged": "Status atualizado.",\n  "op.readOnly": "Operação encerrada.",\n  "op.readOnlyBody": "Este espaço é histórico e somente leitura. Nenhuma alteração é permitida.",','i18n-pt')
              x=rep(x,'  "op.statusChanged": "Status updated.",','  "op.statusChanged": "Status updated.",\n  "op.readOnly": "Operation closed.",\n  "op.readOnlyBody": "This workspace is historical and read-only. No changes are allowed.",','i18n-en')
              ip.write_text(x)

          p=Path('src/routes/_authenticated/operations.$operationId.people.tsx'); s=p.read_text()
          s=rep(s,'import { Dialog, DialogContent, DialogHeader, DialogTitle } from "@/components/ui/dialog";','import { Dialog, DialogContent, DialogHeader, DialogTitle } from "@/components/ui/dialog";\nimport { isOperationClosed, ReadOnlyNotice } from "@/lib/operation-lock";','import')
          s=rep(s,'  roleTypes,\n  operationId,\n}: {\n  row: RosterRow;\n  roleTypes: RoleTypeRow[];\n  operationId: string;\n}) {','  roleTypes,\n  operationId,\n  operationClosed,\n}: {\n  row: RosterRow;\n  roleTypes: RoleTypeRow[];\n  operationId: string;\n  operationClosed: boolean;\n}) {','card-signature')
          s=rep(s,'              {expanded ? (','              {expanded && !operationClosed ? (','role-editor')
          s=rep(s,'                value=""\n                onChange={(e) => {','                value=""\n                disabled={operationClosed}\n                onChange={(e) => {','role-select')
          s=rep(s,'            disabled={row.status === "cancelled"}','            disabled={row.status === "cancelled" || operationClosed}','portal')
          s=rep(s,'          <div className="flex flex-wrap gap-2">\n            {transitions','          {!operationClosed ? (\n          <div className="flex flex-wrap gap-2">\n            {transitions','transitions-open')
          s=rep(s,'              ))}\n          </div>\n\n          {transitions.includes("cancelled") ? (','              ))}\n          </div>\n          ) : null}\n\n          {!operationClosed && transitions.includes("cancelled") ? (','transitions-close')

          marker='  const roster = useQuery({'
          q='''  const operation = useQuery({\n    queryKey: ["operation-status", operationId],\n    enabled: Boolean(tenant?.id) && canOperate,\n    queryFn: async () => {\n      const { data, error } = await supabase.from("operations").select("id, status").eq("id", operationId).single();\n      if (error) throw error;\n      return data;\n    },\n  });\n\n'''
          s=rep(s,marker,q+marker,'operation-query')
          s=rep(s,'  if (roster.isLoading || roleTypes.isLoading) return <PanelSkeleton rows={4} />;','  if (roster.isLoading || roleTypes.isLoading || operation.isLoading) return <PanelSkeleton rows={4} />;','loading')
          s=rep(s,'  const rows = roster.data ?? [];','  const operationClosed = isOperationClosed(operation.data?.status);\n\n  const rows = roster.data ?? [];','closed-var')
          s=rep(s,'    <div className="space-y-5">\n      <section className="animate-rise flex flex-wrap items-start justify-between gap-3">','    <div className="space-y-5">\n      {operationClosed ? <ReadOnlyNotice /> : null}\n      <section className="animate-rise flex flex-wrap items-start justify-between gap-3">','notice')
          btn='''        <Button className="min-h-11" onClick={() => setAddOpen(true)}>\n          <Plus className="mr-2 size-4" aria-hidden="true" />\n          {t("roster.add")}\n        </Button>'''
          s=rep(s,btn,'        {!operationClosed ? (\n'+btn+'\n        ) : null}','add-button')
          s=rep(s,'          action={\n            <Button className="mt-2 min-h-11" onClick={() => setAddOpen(true)}>\n              {t("roster.add")}\n            </Button>\n          }','          action={\n            !operationClosed ? (\n              <Button className="mt-2 min-h-11" onClick={() => setAddOpen(true)}>\n                {t("roster.add")}\n              </Button>\n            ) : undefined\n          }','empty-add')
          s=rep(s,'                  operationId={operationId}\n                />','                  operationId={operationId}\n                  operationClosed={operationClosed}\n                />','card-prop')
          s=rep(s,'        open={addOpen}\n        onOpenChange={setAddOpen}','        open={addOpen && !operationClosed}\n        onOpenChange={(open) => setAddOpen(operationClosed ? false : open)}','dialog')
          p.write_text(s)
          PY
          git diff --check
          grep -q 'operationClosed' 'src/routes/_authenticated/operations.$operationId.people.tsx'
      - name: Commit and remove one-shot workflow
        run: |
          rm .github/workflows/px-a05-people-readonly.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(alpha): lock completed operation people UX"
          git push origin HEAD:preview/alpha-productization-px01
