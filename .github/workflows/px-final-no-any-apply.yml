name: PX final no-any apply
on:
  push:
    branches: [preview/alpha-productization-px01]
    paths: [.github/workflows/px-final-no-any-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/alpha-productization-px01
          fetch-depth: 0
      - name: Sync scoped generated types and remove explicit any
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(path, old, new, label):
              p=Path(path); s=p.read_text(); n=s.count(old); print(label,n)
              if n != 1: raise SystemExit(f'{label}: expected 1, got {n}')
              p.write_text(s.replace(old,new,1))

          types=Path('src/integrations/supabase/types.ts')
          s=types.read_text()
          if '      operation_staff_assignments: {' not in s:
              table='''      operation_staff_assignments: {\n        Row: {\n          cancelled_at: string | null;\n          completed_at: string | null;\n          confirmed_at: string | null;\n          created_at: string;\n          created_by: string | null;\n          declined_at: string | null;\n          ends_at: string;\n          id: string;\n          notes: string | null;\n          operation_id: string;\n          participation_id: string;\n          report_at: string | null;\n          role_type_id: string;\n          starts_at: string;\n          status: Database["public"]["Enums"]["staff_assignment_status"];\n          tenant_id: string;\n          updated_at: string;\n          updated_by: string | null;\n        };\n        Insert: {\n          cancelled_at?: string | null; completed_at?: string | null; confirmed_at?: string | null; created_at?: string; created_by?: string | null; declined_at?: string | null;\n          ends_at: string; id?: string; notes?: string | null; operation_id: string; participation_id: string; report_at?: string | null; role_type_id: string; starts_at: string;\n          status?: Database["public"]["Enums"]["staff_assignment_status"]; tenant_id: string; updated_at?: string; updated_by?: string | null;\n        };\n        Update: {\n          cancelled_at?: string | null; completed_at?: string | null; confirmed_at?: string | null; created_at?: string; created_by?: string | null; declined_at?: string | null;\n          ends_at?: string; id?: string; notes?: string | null; operation_id?: string; participation_id?: string; report_at?: string | null; role_type_id?: string; starts_at?: string;\n          status?: Database["public"]["Enums"]["staff_assignment_status"]; tenant_id?: string; updated_at?: string; updated_by?: string | null;\n        };\n        Relationships: [\n          { foreignKeyName: "operation_staff_assignments_created_by_fkey"; columns: ["created_by"]; isOneToOne: false; referencedRelation: "profiles"; referencedColumns: ["id"] },\n          { foreignKeyName: "operation_staff_assignments_operation_fk"; columns: ["operation_id", "tenant_id"]; isOneToOne: false; referencedRelation: "operations"; referencedColumns: ["id", "tenant_id"] },\n          { foreignKeyName: "operation_staff_assignments_participation_fk"; columns: ["participation_id", "tenant_id"]; isOneToOne: false; referencedRelation: "operation_participations"; referencedColumns: ["id", "tenant_id"] },\n          { foreignKeyName: "operation_staff_assignments_role_type_fk"; columns: ["role_type_id", "tenant_id"]; isOneToOne: false; referencedRelation: "operation_role_types"; referencedColumns: ["id", "tenant_id"] },\n          { foreignKeyName: "operation_staff_assignments_tenant_id_fkey"; columns: ["tenant_id"]; isOneToOne: false; referencedRelation: "tenants"; referencedColumns: ["id"] },\n          { foreignKeyName: "operation_staff_assignments_updated_by_fkey"; columns: ["updated_by"]; isOneToOne: false; referencedRelation: "profiles"; referencedColumns: ["id"] },\n        ];\n      };\n'''
              if s.count('      operations: {') != 1: raise SystemExit('operations table anchor mismatch')
              s=s.replace('      operations: {',table+'      operations: {',1)

          funcs={
            '      generate_due_staff_journey_alerts: {': '''      generate_due_staff_journey_alerts: { Args: { _tenant_id: string; _window_end?: string; _window_start?: string }; Returns: Json };\n''',
            '      get_my_message_inbox: {': '''      get_my_message_inbox: { Args: { _limit?: number; _tenant_id: string }; Returns: Json };\n''',
            '      get_operation_staff_assignment_conflicts: {': '''      get_operation_staff_assignment_conflicts: { Args: { _from: string; _tenant_id: string; _to: string }; Returns: { assignment_id: string; conflicting_assignment_id: string; overlap_end: string; overlap_start: string; participation_id: string }[] };\n''',
            '      mark_message_read: {': '''      mark_message_read: { Args: { _message_id: string }; Returns: Json };\n''',
            '      save_operation_staff_assignment: {': '''      save_operation_staff_assignment: { Args: { _assignment_id?: string; _ends_at: string; _notes?: string; _operation_id: string; _participation_id: string; _report_at?: string; _role_type_id: string; _starts_at: string; _tenant_id: string }; Returns: string };\n''',
            '      set_operation_staff_assignment_status: {': '''      set_operation_staff_assignment_status: { Args: { _assignment_id: string; _note?: string; _status: Database["public"]["Enums"]["staff_assignment_status"] }; Returns: undefined };\n''',
          }
          anchor='      get_commerce_catalog: {'
          for key, snippet in funcs.items():
              if key not in s:
                  if s.count(anchor) != 1: raise SystemExit('function anchor mismatch')
                  s=s.replace(anchor,snippet+anchor,1)
          if '      staff_assignment_status:' not in s:
              enum='''      staff_assignment_event_type: "created" | "rescheduled" | "confirmed" | "declined" | "cancelled" | "completed";\n      staff_assignment_status: "assigned" | "confirmed" | "declined" | "cancelled" | "completed";\n'''
              if s.count('      step_plan_origin:') != 1: raise SystemExit('enum anchor mismatch')
              s=s.replace('      step_plan_origin:',enum+'      step_plan_origin:',1)
          types.write_text(s)

          # Personal alerts: generated RPC types are current, no cast required.
          p='src/components/operations/personal-alerts.tsx'
          once(p,'  const db = supabase as any;\n','', 'alerts db any')
          q=Path(p); t=q.read_text().replace('await db.rpc(', 'await supabase.rpc('); q.write_text(t)

          # Personal queue: use generated table/RPC types and infer joined assignment row.
          p='src/components/operations/personal-operation-queue.tsx'
          once(p,'  const db = supabase as any;\n','', 'queue db any')
          q=Path(p); t=q.read_text().replace('        db\n          .from("operation_staff_assignments")','        supabase\n          .from("operation_staff_assignments")').replace('await db.rpc(', 'await supabase.rpc(')
          old='''      const staffByParticipation = new Map<string, any[]>();\n      for (const row of staffAssignments.data ?? []) {'''
          new='''      type StaffAssignmentRow = NonNullable<typeof staffAssignments.data>[number];\n      const staffByParticipation = new Map<string, StaffAssignmentRow[]>();\n      for (const row of staffAssignments.data ?? []) {'''
          if t.count(old)!=1: raise SystemExit('queue staff map mismatch')
          t=t.replace(old,new,1)
          t=t.replace('''  mutation: ReturnType<\n    typeof useMutation<any, Error, { assignmentId: string; status: "confirmed" | "declined" }>\n  >;''','''  mutation: ReturnType<typeof useMutation<void, Error, { assignmentId: string; status: "confirmed" | "declined" }>>;''',1)
          q.write_text(t)

          # Team schedule: generated schema now covers tables/RPCs; narrow unknown errors safely.
          p='src/routes/_authenticated/operations.$operationId.schedule.tsx'
          once(p,'  const db = supabase as any;\n','', 'schedule db any')
          q=Path(p); t=q.read_text().replace('        db\n          .from(', '        supabase\n          .from(').replace('        db.rpc(', '        supabase.rpc(').replace('? db.from(', '? supabase.from(').replace('await db.rpc(', 'await supabase.rpc(')
          t=t.replace('(p: any) => one(p.people)?.id === me.data.id','(p) => one(p.people)?.id === me.data.id')
          old='''    onError: (err: any) =>\n      setError(\n        err?.message ??\n          copy(locale, "Não foi possível salvar a escala.", "Could not save schedule."),\n      ),'''
          new='''    onError: (err: unknown) =>\n      setError(\n        err instanceof Error\n          ? err.message\n          : copy(locale, "Não foi possível salvar a escala.", "Could not save schedule."),\n      ),'''
          if t.count(old)!=1: raise SystemExit('save onError mismatch')
          t=t.replace(old,new,1)
          old='''    onError: (err: any) =>\n      setError(\n        err?.message ??\n          copy(locale, "Não foi possível alterar a escala.", "Could not update schedule."),\n      ),'''
          new='''    onError: (err: unknown) =>\n      setError(\n        err instanceof Error\n          ? err.message\n          : copy(locale, "Não foi possível alterar a escala.", "Could not update schedule."),\n      ),'''
          if t.count(old)!=1: raise SystemExit('status onError mismatch')
          t=t.replace(old,new,1).replace('conflicts.flatMap((item: any) => [item.assignment_id, item.conflicting_assignment_id])','conflicts.flatMap((item) => [item.assignment_id, item.conflicting_assignment_id])')
          q.write_text(t)

          # Staff alert API no longer needs a cast once generated types are synced.
          p=Path('src/routes/api.cron.staff-alerts.ts'); t=p.read_text()
          cast='''  const generateDueAlerts = supabase.rpc as unknown as (\n    fn: "generate_due_staff_journey_alerts",\n    args: { _tenant_id: string; _window_start: string; _window_end: string },\n  ) => PromiseLike<{ data: unknown; error: { message: string } | null }>;\n\n'''
          t=t.replace(cast,'').replace('await generateDueAlerts("generate_due_staff_journey_alerts", {','await supabase.rpc("generate_due_staff_journey_alerts", {')
          p.write_text(t)
          PY
          bunx prettier --write src/integrations/supabase/types.ts src/components/operations/personal-alerts.tsx src/components/operations/personal-operation-queue.tsx 'src/routes/_authenticated/operations.$operationId.schedule.tsx' src/routes/api.cron.staff-alerts.ts
          git diff --check
      - name: Commit scoped typing fix
        run: |
          rm -f .github/workflows/px-final-no-any-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(alpha): sync staff schedule Supabase types"
          git push origin HEAD:preview/alpha-productization-px01
