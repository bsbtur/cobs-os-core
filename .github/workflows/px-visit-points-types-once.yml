name: PX visit points type sync once

on:
  push:
    branches:
      - preview/alpha-productization-px01
    paths:
      - .github/workflows/px-visit-points-types-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/alpha-productization-px01
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: python3 .github/scripts/patch_visit_points_types.py
      - run: bunx prettier --write src/integrations/supabase/types.ts src/components/journey/visit-points-panel.tsx
      - run: bunx tsc --noEmit
      - run: bun run lint
      - name: Commit synchronized types
        run: |
          git config user.name "bsbtur"
          git config user.email "contato.bsbtur@gmail.com"
          git add -- src/integrations/supabase/types.ts src/components/journey/visit-points-panel.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(visit-points): sync schema types"
          git push origin HEAD:preview/alpha-productization-px01
