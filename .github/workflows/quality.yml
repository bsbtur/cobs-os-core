name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        id: lint
        shell: bash
        run: |
          set -o pipefail
          bun run lint 2>&1 | tee lint-output.txt

      - name: Commit lint autofixes on audit branch
        if: >-
          failure() &&
          steps.lint.outcome == 'failure' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.head_ref == 'audit/release-gate-ci-20260822'
        shell: bash
        run: |
          bun run lint -- --fix || true
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "style: apply eslint autofixes"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload lint diagnostics
        if: failure() && steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: lint-output
          path: lint-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Tests
        run: bun run test

      - name: Build
        run: bun run build
