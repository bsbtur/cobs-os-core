name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # TanStack Router generates src/routeTree.gen.ts through the Vite plugin.
      # Build first so the current route set exists before static validation.
      - name: Build
        run: bun run build

      # Normalize generated files and source formatting before ESLint/Prettier validation.
      - name: Format
        run: bun run format

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun run test
