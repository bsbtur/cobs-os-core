name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        id: lint
        shell: bash
        run: |
          set -o pipefail
          bun run lint 2>&1 | tee lint-output.txt

      - name: Prepare lint autofix bundle
        if: failure() && steps.lint.outcome == 'failure'
        shell: bash
        run: |
          bun run lint -- --fix || true
          git diff --binary > lint-fixes.patch
          git diff --name-only -z | tar --null -T - -czf lint-fixed-files.tar.gz

      - name: Upload lint diagnostics
        if: failure() && steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: lint-output
          path: |
            lint-output.txt
            lint-fixes.patch
            lint-fixed-files.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Tests
        run: bun run test

      - name: Build
        run: bun run build
