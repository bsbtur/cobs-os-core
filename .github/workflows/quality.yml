name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Apply and commit lint autofixes on audit branch
        if: failure() && github.event_name == 'pull_request' && github.head_ref == 'audit/release-gate-ci-20260822'
        run: |
          bunx eslint . --fix || true
          if git diff --quiet; then
            echo "No autofixes generated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Apply ESLint and Prettier autofixes"
          git push origin HEAD:audit/release-gate-ci-20260822

      - name: Tests
        run: bun run test

      - name: Build
        run: bun run build
