name: Quality Gate
# Trigger validation on the current PR head after dependency/lockfile alignment.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Refresh lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/ciosp-approved-visual' && !contains(github.event.pull_request.title, 'chore: sync bun lockfile')
        run: |
          bun install
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock
          git diff --cached --quiet || git commit -m 'chore: sync bun lockfile'
          git push

      # TanStack Router generates src/routeTree.gen.ts through the Vite plugin.
      # Build first so the current route set exists before static validation.
      - name: Build
        run: bun run build

      # Normalize generated files and source formatting before ESLint/Prettier validation.
      - name: Format
        run: bun run format

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun run test
