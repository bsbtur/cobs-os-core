name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Generate lint autofix package
        if: failure()
        run: |
          bunx eslint . --fix || true
          git diff --binary > /tmp/lint-autofix.patch
          git diff --name-only -z | tar --null -T - -czf /tmp/lint-autofix-files.tgz

      - name: Upload lint autofix patch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-autofix-patch
          path: /tmp/lint-autofix.patch
          if-no-files-found: error
          retention-days: 1

      - name: Upload lint autofix files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-autofix-files
          path: /tmp/lint-autofix-files.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Tests
        run: bun run test

      - name: Build
        run: bun run build
