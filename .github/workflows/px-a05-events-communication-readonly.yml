name: PX-A05 events communication readonly UX

on:
  push:
    branches: [preview/alpha-productization-px01]
    paths: [.github/workflows/px-a05-events-communication-readonly.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/alpha-productization-px01
          fetch-depth: 0
      - name: Apply operation read-only UX
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p=Path(path); s=p.read_text()
              for old,new,label in replacements:
                  n=s.count(old); print(path,label,'matches=',n)
                  if n < 1: raise SystemExit(f'{path} {label}: missing expected pattern')
                  s=s.replace(old,new,1)
              p.write_text(s)

          patch('src/routes/_authenticated/operations.$operationId.events.tsx', [
            ('import { formatDateTime } from "@/lib/format";', 'import { formatDateTime } from "@/lib/format";\nimport { isOperationClosed, ReadOnlyNotice } from "@/lib/operation-lock";', 'import'),
            ('  const events = useQuery({', '  const operation = useQuery({\n    queryKey: ["operation-status", operationId],\n    queryFn: async () => {\n      const { data, error } = await supabase.from("operations").select("status").eq("id", operationId).maybeSingle();\n      if (error) throw error;\n      return data;\n    },\n  });\n\n  const events = useQuery({', 'operation-query'),
            ('  const canOperate = canManage || role === "operations_agent";', '  const canOperate = canManage || role === "operations_agent";', 'anchor'),
            ('  if (events.isLoading) return <PanelSkeleton rows={4} />;', '  if (events.isLoading || operation.isLoading) return <PanelSkeleton rows={4} />;\n\n  const operationClosed = isOperationClosed(operation.data?.status);\n  const liveCanOperate = canOperate && !operationClosed;', 'closed-var'),
            ('      <header className="surface-panel animate-rise space-y-2 p-5">', '      {operationClosed ? <ReadOnlyNotice /> : null}\n\n      <header className="surface-panel animate-rise space-y-2 p-5">', 'notice'),
            ('          {canOperate ? (', '          {liveCanOperate ? (', 'new-event'),
            ('            canOperate={canOperate}', '            canOperate={liveCanOperate}', 'run'),
            ('          <LifecyclePanel event={selected} onChanged={refresh} />', '          {!operationClosed ? <LifecyclePanel event={selected} onChanged={refresh} /> : null}', 'lifecycle'),
            ('            canOperate={canOperate}', '            canOperate={liveCanOperate}', 'program'),
            ('            canOperate={canOperate}', '            canOperate={liveCanOperate}', 'crew'),
            ('      <Dialog open={creating} onOpenChange={setCreating}>', '      {!operationClosed ? (\n      <Dialog open={creating} onOpenChange={setCreating}>', 'dialog-open'),
            ('      </Dialog>\n    </div>', '      </Dialog>\n      ) : null}\n    </div>', 'dialog-close'),
          ])

          patch('src/routes/_authenticated/operations.$operationId.communication.tsx', [
            ('import { formatDateTime } from "@/lib/format";', 'import { formatDateTime } from "@/lib/format";\nimport { isOperationClosed, ReadOnlyNotice } from "@/lib/operation-lock";', 'import'),
            ('function AudiencePanel({\n  message,\n  selectors,\n  roleTypes,\n  people,\n  onChanged,', 'function AudiencePanel({\n  message,\n  selectors,\n  roleTypes,\n  people,\n  onChanged,\n  operationClosed,', 'audience-prop-open'),
            ('  onChanged: () => void;\n}) {\n  const { t, locale } = useI18n();\n  const editable = canAct(message.status, "audience");', '  onChanged: () => void;\n  operationClosed: boolean;\n}) {\n  const { t, locale } = useI18n();\n  const editable = !operationClosed && canAct(message.status, "audience");', 'audience-prop-type'),
            ('  onSelect,\n}: {\n  message: FeedMessage;\n  operationId: string;\n  onChanged: () => void;\n  onSelect: (id: string) => void;', '  onSelect,\n  operationClosed,\n}: {\n  message: FeedMessage;\n  operationId: string;\n  onChanged: () => void;\n  onSelect: (id: string) => void;\n  operationClosed: boolean;', 'detail-prop'),
            ('      {canAct(message.status, "edit") ? (', '      {!operationClosed && canAct(message.status, "edit") ? (', 'edit'),
            ('          onChanged={refresh}\n        />', '          onChanged={refresh}\n          operationClosed={operationClosed}\n        />', 'audience-pass'),
            ('      <section className="surface-panel space-y-3 p-4">\n        <h3 className="text-sm font-medium">{t("w08.publish")}</h3>', '      {!operationClosed ? (\n      <section className="surface-panel space-y-3 p-4">\n        <h3 className="text-sm font-medium">{t("w08.publish")}</h3>', 'commands-open'),
            ('      </section>\n\n      {recipients.data ? (', '      </section>\n      ) : null}\n\n      {recipients.data ? (', 'commands-close'),
            ('  const feed = useQuery({', '  const operation = useQuery({\n    queryKey: ["operation-status", operationId],\n    queryFn: async () => {\n      const { data, error } = await supabase.from("operations").select("status").eq("id", operationId).maybeSingle();\n      if (error) throw error;\n      return data;\n    },\n  });\n\n  const feed = useQuery({', 'operation-query'),
            ('  if (feed.isLoading) return <PanelSkeleton rows={5} />;', '  if (feed.isLoading || operation.isLoading) return <PanelSkeleton rows={5} />;\n\n  const operationClosed = isOperationClosed(operation.data?.status);', 'closed-var'),
            ('      <header className="flex flex-wrap items-start gap-3">', '      {operationClosed ? <ReadOnlyNotice /> : null}\n\n      <header className="flex flex-wrap items-start gap-3">', 'notice'),
            ('        <Button type="button" className="min-h-11" onClick={() => setCreateOpen(true)}>', '        {!operationClosed ? (\n        <Button type="button" className="min-h-11" onClick={() => setCreateOpen(true)}>', 'new-open'),
            ('          {t("w08.new")}\n        </Button>', '          {t("w08.new")}\n        </Button>\n        ) : null}', 'new-close'),
            ('      {tenant ? (', '      {tenant && !operationClosed ? (', 'dialog'),
            ('              onSelect={setSelectedId}\n            />', '              onSelect={setSelectedId}\n              operationClosed={operationClosed}\n            />', 'detail-pass'),
          ])
          PY
          git diff --check
          grep -q 'liveCanOperate' 'src/routes/_authenticated/operations.$operationId.events.tsx'
          grep -q 'operationClosed={operationClosed}' 'src/routes/_authenticated/operations.$operationId.communication.tsx'
      - name: Commit and remove one-shot workflow
        run: |
          rm .github/workflows/px-a05-events-communication-readonly.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(alpha): lock completed events and communication UX"
          git push origin HEAD:preview/alpha-productization-px01