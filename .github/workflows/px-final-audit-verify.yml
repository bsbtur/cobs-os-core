name: PX final audit verify

on:
  push:
    branches:
      - preview/alpha-productization-px01
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/alpha-productization-px01
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Tests
        run: bun test
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Lint
        shell: bash
        run: |
          set +e
          bunx eslint . --format json > /tmp/eslint.json
          status=$?
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          rows=json.loads(Path('/tmp/eslint.json').read_text())
          errors=[]
          warnings=[]
          for row in rows:
              rel=row['filePath'].split('/cobs-os-core/')[-1]
              for m in row.get('messages',[]):
                  item=(rel,m.get('line'),m.get('column'),m.get('ruleId'),m.get('message'))
                  (errors if m.get('severity')==2 else warnings).append(item)
          print(f'LINT_ERRORS={len(errors)} LINT_WARNINGS={len(warnings)}')
          print('RULES_ERRORS=' + repr(dict(Counter(x[3] or 'parser' for x in errors))))
          print('RULES_WARNINGS=' + repr(dict(Counter(x[3] or 'parser' for x in warnings))))
          for x in errors[:200]: print('ERR', *x, sep=' | ')
          for x in warnings[:50]: print('WARN', *x, sep=' | ')
          PY
          exit $status
      - name: Build
        run: bun run build

# Strict gate: no soft failures. Post-format diagnostic run.
