name: PX visit points v3.2 once

on:
  push:
    branches:
      - preview/alpha-productization-px01
    paths:
      - .github/workflows/px-visit-points-v32-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/alpha-productization-px01
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: python3 .github/scripts/visit_points_v32_finalize.py
      - run: bunx prettier --write src/integrations/supabase/types.ts src/components/journey/visit-points-editor.tsx src/components/journey/visit-points-panel.tsx
      - run: bun test
      - run: bunx tsc --noEmit
      - run: bun run lint
      - run: bun run build
      - name: Commit V3.2 finalization
        run: |
          git config user.name "bsbtur"
          git config user.email "contato.bsbtur@gmail.com"
          git add -- src/integrations/supabase/types.ts src/components/journey/visit-points-editor.tsx src/components/journey/visit-points-panel.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(visit-points): finalize v3.2 management"
          git push origin HEAD:preview/alpha-productization-px01
