name: PX-A05 journey readonly UX

on:
  push:
    branches: [preview/alpha-productization-px01]
    paths: [.github/workflows/px-a05-journey-readonly.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/alpha-productization-px01
          fetch-depth: 0
      - name: Apply Journey read-only UX
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/routes/_authenticated/operations.$operationId.journey.tsx')
          s=p.read_text()
          def rep(old,new,label,count=1):
              global s
              n=s.count(old); print(label,'matches=',n)
              if n < count: raise SystemExit(f'{label}: missing expected pattern')
              s=s.replace(old,new,count)

          rep('import { useTenant } from "@/lib/tenant";','import { useTenant } from "@/lib/tenant";\nimport { isOperationClosed, ReadOnlyNotice } from "@/lib/operation-lock";','import')
          rep('  roleTypes,\n  operationId,\n}: {\n  step: JourneyStepRow;\n  items: PlaybookItemRow[];\n  roleTypes: RoleTypeRow[];\n  operationId: string;\n}) {','  roleTypes,\n  operationId,\n  operationClosed,\n}: {\n  step: JourneyStepRow;\n  items: PlaybookItemRow[];\n  roleTypes: RoleTypeRow[];\n  operationId: string;\n  operationClosed: boolean;\n}) {','playbook-signature')
          rep('      <div className="mt-3 flex flex-col gap-2 sm:flex-row">','      {!operationClosed ? (\n        <>\n          <div className="mt-3 flex flex-col gap-2 sm:flex-row">','playbook-open')
          rep('      <p className="mt-2 text-xs text-muted-foreground">{t("w04.playbook.ownerHint")}</p>','          <p className="mt-2 text-xs text-muted-foreground">{t("w04.playbook.ownerHint")}</p>\n        </>\n      ) : null}','playbook-close')
          rep('  const baselineOpen = operation.status === "draft" || operation.status === "planning";','  const baselineOpen = operation.status === "draft" || operation.status === "planning";\n  const operationClosed = isOperationClosed(operation.status);','closed-var')
          rep('  const move = (index: number, direction: -1 | 1) => {','  const move = (index: number, direction: -1 | 1) => {\n    if (operationClosed) return;','move-guard')
          rep('{canEditBlueprints(role) && baselineOpen && steps.length === 0 && !provisioning.data ? (','{!operationClosed && canEditBlueprints(role) && baselineOpen && steps.length === 0 && !provisioning.data ? (','blueprint')
          old='''          <Button\n            className="min-h-11"\n            onClick={() => setDialog(baselineOpen ? "planned" : "ad_hoc")}\n            disabled={operation.status === "completed" || operation.status === "cancelled"}\n          >\n            <Plus className="mr-1.5 size-4" aria-hidden="true" />\n            {baselineOpen ? t("w04.journey.addStep") : t("w04.journey.addAdHoc")}\n          </Button>'''
          new='''          {!operationClosed ? (\n            <Button\n              className="min-h-11"\n              onClick={() => setDialog(baselineOpen ? "planned" : "ad_hoc")}\n            >\n              <Plus className="mr-1.5 size-4" aria-hidden="true" />\n              {baselineOpen ? t("w04.journey.addStep") : t("w04.journey.addAdHoc")}\n            </Button>\n          ) : null}'''
          rep(old,new,'add-step')
          rep('      </header>\n\n      {journeyOrigin ? (','      </header>\n\n      {operationClosed ? <ReadOnlyNotice /> : null}\n\n      {journeyOrigin ? (','notice')
          rep('                  {baselineOpen ? (','                  {baselineOpen && !operationClosed ? (','reorder')
          forecast='''                  <Button\n                    variant="outline"\n                    size="sm"\n                    className="min-h-9"\n                    onClick={() => setForecastStep(step)}\n                  >\n                    {t("w04.expected.change")}\n                  </Button>'''
          rep(forecast,'                  {!operationClosed ? (\n'+forecast+'\n                  ) : null}','forecast')
          rep('                operationId={operationId}\n              />','                operationId={operationId}\n                operationClosed={operationClosed}\n              />','playbook-prop')
          rep('        open={applyOpen}\n        onOpenChange={setApplyOpen}','        open={applyOpen && !operationClosed}\n        onOpenChange={(open) => setApplyOpen(operationClosed ? false : open)}','apply-dialog')
          rep('        open={dialog !== null}\n        onOpenChange={(open) => setDialog(open ? dialog : null)}','        open={dialog !== null && !operationClosed}\n        onOpenChange={(open) => setDialog(operationClosed ? null : open ? dialog : null)}','step-dialog')
          rep('        step={forecastStep}\n        onOpenChange={(open) => setForecastStep(open ? forecastStep : null)}','        step={operationClosed ? null : forecastStep}\n        onOpenChange={(open) => setForecastStep(operationClosed ? null : open ? forecastStep : null)}','forecast-dialog')
          p.write_text(s)
          PY
          git diff --check
          grep -q 'operationClosed' 'src/routes/_authenticated/operations.$operationId.journey.tsx'
      - name: Commit and remove one-shot workflow
        run: |
          rm .github/workflows/px-a05-journey-readonly.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(alpha): lock completed operation journey UX"
          git push origin HEAD:preview/alpha-productization-px01
