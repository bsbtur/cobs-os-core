name: PILOT-03 hardening fix pack 01 final
on:
  push:
    branches: [preview/alpha-productization-px01]
    paths: [.github/workflows/pilot03-hardening-fix-pack-01-final.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/alpha-productization-px01
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply scoped patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def r(path, old, new, label):
              p=Path(path); s=p.read_text(); n=s.count(old); print(label,n)
              if n < 1: raise SystemExit(f'missing {label}')
              p.write_text(s.replace(old,new,1))
          r('src/lib/operation-lock.tsx','export function isOperationClosed(status: string | null | undefined): boolean {\n  return status === "completed" || status === "cancelled";\n}\n','export function isOperationClosed(status: string | null | undefined): boolean {\n  return status === "completed" || status === "cancelled";\n}\n\nexport function operationEmptyBody(\n  operationClosed: boolean, locale: string, historicalPt: string, historicalEn: string, editableBody: string,\n): string {\n  if (!operationClosed) return editableBody;\n  return locale.toLowerCase().startsWith("pt") ? historicalPt : historicalEn;\n}\n','helper')
          r('src/routes/_authenticated/operations.$operationId.schedule.tsx','{own && assignment.status === "assigned" ? <><Button','{!operationClosed && own && assignment.status === "assigned" ? <><Button','schedule-own')
          r('src/routes/_authenticated/operations.$operationId.schedule.tsx','{canManage && ["assigned", "confirmed"].includes(assignment.status) ? <Button','{!operationClosed && canManage && ["assigned", "confirmed"].includes(assignment.status) ? <Button','schedule-cancel')
          for path,icon,key,pt,en in [
            ('src/routes/_authenticated/operations.$operationId.mobility.tsx','Bus','w05','Nenhum trecho de transporte foi registrado nesta operação.','No transport leg was recorded for this operation.'),
            ('src/routes/_authenticated/operations.$operationId.hospitality.tsx','BedDouble','w06','Nenhuma hospedagem foi registrada nesta operação.','No accommodation was recorded for this operation.'),
            ('src/routes/_authenticated/operations.$operationId.events.tsx','Clapperboard','w07','Nenhum evento foi registrado nesta operação.','No event was recorded for this operation.'),
          ]:
              r(path,'import { isOperationClosed, ReadOnlyNotice } from "@/lib/operation-lock";','import { isOperationClosed, operationEmptyBody, ReadOnlyNotice } from "@/lib/operation-lock";',path+' import')
              old=f'<EmptyState icon={{{icon}}} title={{t("{key}.empty")}} body={{t("{key}.emptyBody")}} />'
              new=f'<EmptyState icon={{{icon}}} title={{t("{key}.empty")}} body={{operationEmptyBody(operationClosed, locale, "{pt}", "{en}", t("{key}.emptyBody"))}} />'
              r(path,old,new,path+' empty')
          p='src/routes/_authenticated/operations.$operationId.communication.tsx'
          r(p,'import { isOperationClosed, ReadOnlyNotice } from "@/lib/operation-lock";','import { isOperationClosed, operationEmptyBody, ReadOnlyNotice } from "@/lib/operation-lock";','comm import')
          old='<EmptyState icon={MessagesSquare} title={t("w08.empty")} body={t("w08.emptyBody")} />'
          new='<EmptyState icon={MessagesSquare} title={t("w08.empty")} body={operationEmptyBody(operationClosed, locale, "Nenhuma mensagem foi registrada nesta operação.", "No message was recorded for this operation.", t("w08.emptyBody"))} />'
          r(p,old,new,'comm empty 1'); r(p,old,new,'comm empty 2')
          p='src/components/operations/operation-attention-center.tsx'
          r(p,'import { useI18n } from "@/lib/i18n";','import { useI18n } from "@/lib/i18n";\nimport { isOperationClosed } from "@/lib/operation-lock";','attention import')
          r(p,'  const isLive = location.pathname.endsWith(`/operations/${operationId}/live`);\n\n  const query = useQuery({','  const isLive = location.pathname.endsWith(`/operations/${operationId}/live`);\n\n  const operation = useQuery({\n    queryKey: ["operation-status", operationId], enabled: isLive, staleTime: 10_000,\n    queryFn: async () => { const { data, error } = await supabase.from("operations").select("status").eq("id", operationId).maybeSingle(); if (error) throw error; return data; },\n  });\n  const operationClosed = isOperationClosed(operation.data?.status);\n\n  const query = useQuery({','attention status')
          r(p,'    enabled: isLive,\n    refetchInterval: 20_000,','    enabled: isLive && operation.isSuccess && !operationClosed,\n    refetchInterval: operationClosed ? false : 20_000,','attention polling')
          r(p,'  if (!isLive) return null;\n\n  if (query.isLoading) {','  if (!isLive || operationClosed) return null;\n  if (operation.isLoading) return null;\n\n  if (query.isLoading) {','attention hide')
          Path('src/lib/post-completion-hardening.test.ts').write_text('''import { describe, expect, test } from "bun:test";\nimport { readFileSync } from "node:fs";\nimport { isOperationClosed, operationEmptyBody } from "./operation-lock";\nconst read=(p:string)=>readFileSync(p,"utf8");\ndescribe("PILOT-03 post-completion hardening",()=>{\n test("closed lifecycle",()=>{expect(isOperationClosed("completed")).toBe(true);expect(isOperationClosed("cancelled")).toBe(true);expect(isOperationClosed("active")).toBe(false)});\n test("lifecycle-aware empty copy",()=>{expect(operationEmptyBody(true,"pt-BR","Histórico","Historical","Criar")).toBe("Histórico");expect(operationEmptyBody(false,"pt-BR","Histórico","Historical","Criar")).toBe("Criar")});\n test("schedule controls are closed-gated",()=>{const s=read("src/routes/_authenticated/operations.$operationId.schedule.tsx");expect(s).toContain("!operationClosed && own && assignment.status");expect(s).toContain("!operationClosed && canManage &&")});\n test("server guard covers staff assignment updates",()=>{const s=read("supabase/migrations/20260815211500_px12_7_closed_operation_read_only_guards.sql");expect(s).toContain("trg_closed_op_staff_assignments");expect(s).toContain("before insert or update or delete on public.operation_staff_assignments");expect(s).toContain("assert_operation_not_closed")});\n test("live attention stops for closed operation",()=>{const s=read("src/components/operations/operation-attention-center.tsx");expect(s).toContain("operation.isSuccess && !operationClosed");expect(s).toContain("if (!isLive || operationClosed) return null")});\n test("historical modules use shared empty copy",()=>{for(const p of ["src/routes/_authenticated/operations.$operationId.mobility.tsx","src/routes/_authenticated/operations.$operationId.hospitality.tsx","src/routes/_authenticated/operations.$operationId.events.tsx","src/routes/_authenticated/operations.$operationId.communication.tsx"])expect(read(p)).toContain("operationEmptyBody(")});\n});\n''')
          PY
          git diff --check
          bun install --frozen-lockfile
          bun test src/lib/post-completion-hardening.test.ts
          bun run build
      - name: Commit scoped fix
        run: |
          rm -f .github/workflows/pilot03-hardening-fix-pack-01.yml .github/workflows/pilot03-hardening-fix-pack-01-bun.yml .github/workflows/pilot03-hardening-fix-pack-01-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(alpha): harden completed operation historical UX"
          git push origin HEAD:preview/alpha-productization-px01