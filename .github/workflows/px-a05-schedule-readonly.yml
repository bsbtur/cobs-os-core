name: PX-A05 schedule readonly

on:
  push:
    branches:
      - preview/alpha-productization-px01
    paths:
      - .github/workflows/px-a05-schedule-readonly.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/alpha-productization-px01
          fetch-depth: 0
      - name: Apply schedule closed-operation UX lock
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/_authenticated/operations.$operationId.schedule.tsx')
          s = p.read_text()

          def rep(old, new, expected_min=1):
              global s
              count = s.count(old)
              if count < expected_min:
                  raise SystemExit(f'missing expected pattern ({count}): {old[:120]!r}')
              s = s.replace(old, new)

          rep('db.from("operations").select("id,name,code,timezone,planned_start,planned_end").eq("id", operationId).single()',
              'db.from("operations").select("id,name,code,timezone,planned_start,planned_end,status").eq("id", operationId).single()')

          rep('  const { operation, assignments, candidates, conflicts, myParticipationId } = query.data;\n  const noCandidates = candidates.length === 0;',
              '  const { operation, assignments, candidates, conflicts, myParticipationId } = query.data;\n  const operationClosed = operation.status === "completed" || operation.status === "cancelled";\n  const noCandidates = candidates.length === 0;')

          rep('  const cancelAssignment = (id: string) => {\n    const confirmed = window.confirm(copy(',
              '  const cancelAssignment = (id: string) => {\n    if (query.data?.operation?.status === "completed" || query.data?.operation?.status === "cancelled") return;\n    const confirmed = window.confirm(copy(')

          # Administrative write surface.
          rep('{canManage ? (', '{canManage && !operationClosed ? (')
          # Own assignment response surface, where present.
          s = s.replace('{own ? (', '{own && !operationClosed ? (')
          s = s.replace('{own && assignment.status === "assigned" ? (', '{own && !operationClosed && assignment.status === "assigned" ? (')
          s = s.replace('{canManage && assignment.status !== "cancelled" ? (', '{canManage && !operationClosed && assignment.status !== "cancelled" ? (')

          # Add a clear historical notice while preserving all read views.
          marker = '      {conflicts.length ? ('
          if marker not in s:
              raise SystemExit('missing schedule notice marker')
          notice = '''      {operationClosed ? (\n        <section className="surface-panel px-4 py-3 text-sm text-muted-foreground">\n          <span className="font-medium text-foreground">{copy(locale, "Operação encerrada.", "Operation closed.")}</span>{" "}\n          {copy(locale, "A escala está disponível somente para consulta histórica.", "The schedule is available for historical review only.")}\n        </section>\n      ) : null}\n\n'''
          s = s.replace(marker, notice + marker, 1)

          p.write_text(s)
          PY

      - name: Verify no obvious schedule mutation surface remains unlocked
        run: |
          grep -q 'status === "completed"' 'src/routes/_authenticated/operations.$operationId.schedule.tsx'
          grep -q 'canManage && !operationClosed' 'src/routes/_authenticated/operations.$operationId.schedule.tsx'

      - name: Commit schedule UX lock and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/px-a05-schedule-readonly.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(alpha): lock completed operation schedule UX"
          git push origin HEAD:preview/alpha-productization-px01
