name: PX FIX PACK 02 verify

on:
  push:
    branches: [preview/alpha-productization-px01]
    paths: [.github/workflows/px-fix-pack-02-verify.yml]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/alpha-productization-px01
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Targeted regression tests
        run: bun test src/lib/post-completion-hardening.test.ts
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: bunx tsc --noEmit
      - name: Build
        run: bun run build
      - name: Typecheck outcome
        run: echo "typecheck_outcome=${{ steps.typecheck.outcome }}"
