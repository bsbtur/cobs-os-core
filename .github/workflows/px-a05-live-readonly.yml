name: PX-A05 live readonly UX

on:
  push:
    branches: [preview/alpha-productization-px01]
    paths: [.github/workflows/px-a05-live-readonly.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/alpha-productization-px01
          fetch-depth: 0
      - name: Apply Live historical read-only UX
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/routes/_authenticated/operations.$operationId.live.tsx')
          s=p.read_text()
          def rep(old,new,label,count=1):
              global s
              n=s.count(old); print(label,'matches=',n)
              if n < count: raise SystemExit(f'{label}: missing expected pattern')
              s=s.replace(old,new,count)

          rep('import { LiveTimingStrip } from "@/components/journey/live-timing-strip";','import { LiveTimingStrip } from "@/components/journey/live-timing-strip";\nimport { isOperationClosed, ReadOnlyNotice } from "@/lib/operation-lock";','import')
          rep('  const journeyResolved = steps.length > 0 && steps.every((step) => resolvedStepIds.has(step.id));','  const journeyResolved = steps.length > 0 && steps.every((step) => resolvedStepIds.has(step.id));\n  const operationClosed = isOperationClosed(operation.status);','closed-var')
          rep('        <p className="mt-1 text-sm text-muted-foreground">{t("w04.live.subtitle")}</p>\n      </header>','        <p className="mt-1 text-sm text-muted-foreground">{t("w04.live.subtitle")}</p>\n      </header>\n\n      {operationClosed ? <ReadOnlyNotice /> : null}','notice')

          # Hide action engine entirely on historical operations.
          old='''            <div className="mt-4">\n              <SectionLabel>{t("w04.live.action")}</SectionLabel>\n              <div className="mt-2">\n                <StepActions\n                  step={current}\n                  ready={readiness?.ready ?? false}\n                  arrived={arrivedStepIds.has(current.id)}\n                  onRefresh={refresh}\n                />\n              </div>\n            </div>'''
          new='''            {!operationClosed ? (\n              <div className="mt-4">\n                <SectionLabel>{t("w04.live.action")}</SectionLabel>\n                <div className="mt-2">\n                  <StepActions\n                    step={current}\n                    ready={readiness?.ready ?? false}\n                    arrived={arrivedStepIds.has(current.id)}\n                    onRefresh={refresh}\n                  />\n                </div>\n              </div>\n            ) : null}'''
          rep(old,new,'actions')

          rep('                <StartNext step={next} onRefresh={refresh} />','                {!operationClosed ? <StartNext step={next} onRefresh={refresh} /> : null}','start-next')
          rep('{current && current.presence_requirement !== "none" ? (','{current && !operationClosed && current.presence_requirement !== "none" ? (','presence-panel')
          rep('{current ? (\n        <ChecklistPanel','{current && !operationClosed ? (\n        <ChecklistPanel','checklist-panel')

          # Preserve the two previously-approved Alpha corrections.
          if 'px04-next-best-action' not in s or 'px05-operation-attention' not in s:
              raise SystemExit('PX-A01 invalidation missing after patch')
          if 'readinessCountLabel' not in s or 'readiness.requirement !== "none"' not in s:
              raise SystemExit('PX-A04 contextual readiness missing after patch')
          p.write_text(s)
          PY
          git diff --check
          grep -q 'operationClosed' 'src/routes/_authenticated/operations.$operationId.live.tsx'
          grep -q 'px04-next-best-action' 'src/routes/_authenticated/operations.$operationId.live.tsx'
          grep -q 'readinessCountLabel' 'src/routes/_authenticated/operations.$operationId.live.tsx'
      - name: Commit and remove one-shot workflow
        run: |
          rm .github/workflows/px-a05-live-readonly.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(alpha): lock completed operation live UX"
          git push origin HEAD:preview/alpha-productization-px01
